---
# Applied to every machine. Grounded in the cd108 golden harvest. Custom,
# untested golden mechanisms (set-hostname-from-mac.sh) are replaced with the
# idiomatic Ansible path.

# --- apt cache proxy -------------------------------------------------------
# Matches the golden exactly: apt-cacher-ng only proxies http, so https is
# disabled and IPv4 is forced. (The golden also had a redundant 99proxy; we
# keep a single canonical 01proxy.)
- name: Route apt through the lab cache/proxy
  copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "{{ apt_proxy_url }}";
      Acquire::https::Proxy "false";
      Acquire::ForceIPv4 "true";
  when: apt_proxy_url is defined and apt_proxy_url | length > 0

- name: Ensure apt keyrings dir exists
  file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }

# The golden bakes deb822 `.sources` for docker/chrome/vscode that define the SAME
# repos this role adds below as `.list` — apt then errors on the conflicting
# Signed-By. Remove the golden's duplicates so the role's `.list` is the single
# authoritative definition (idempotent; harmless once the golden is re-captured).
- name: Remove golden-baked deb822 sources that duplicate role-managed repos
  file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - docker.sources
    - google-chrome.sources
    - vscode.sources

# --- external repos (managed here so key/URL drift is a one-file fix) -----
- name: Add VS Code repository key
  get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"

- name: Add VS Code apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"
    filename: vscode
    state: present

- name: Add Docker repository key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable"
    filename: docker
    state: present

- name: Add Google Chrome repository key
  get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google-chrome.asc
    mode: "0644"

- name: Add Google Chrome apt repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
    filename: google-chrome
    state: present

# Qucs-S comes from the ra3xdh openSUSE Build Service repo (confirmed on golden).
- name: Add the ra3xdh (Qucs-S) repository key
  get_url:
    url: https://download.opensuse.org/repositories/home:ra3xdh/xUbuntu_24.04/Release.key
    dest: /etc/apt/keyrings/home_ra3xdh.asc
    mode: "0644"

- name: Add the ra3xdh (Qucs-S) apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/home_ra3xdh.asc] https://download.opensuse.org/repositories/home:/ra3xdh/xUbuntu_24.04/ /"
    filename: home_ra3xdh
    state: present

# --- base packages (plain apt) -------------------------------------------
- name: Preseed wireshark to allow non-root capture
  debconf:
    name: wireshark-common
    question: wireshark-common/install-setuid
    vtype: boolean
    value: "true"

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true

- name: Install VS Code + Docker
  apt:
    name: [code, docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

# Heavy/local apps: image-owned binaries plus apt packages. The *-udev-rules
# packages install the ST-Link / J-Link udev rules (no custom rule needed).
- name: Install TeX, embedded toolchain, and virtualization stacks
  apt:
    name: "{{ tex_packages + embedded_packages + virt_packages }}"
    state: present

# --- users ----------------------------------------------------------------
- name: Create one user per discipline (homes land on the ZFS datasets)
  user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ discipline_users }}"

- name: Let course accounts use docker without sudo
  user: { name: "{{ item }}", groups: docker, append: true }
  loop: "{{ docker_users }}"

- name: Install OpenSSH server
  apt: { name: openssh-server, state: present }

# The golden shipped with ssh DISABLED (preset says enable, but it was turned
# off), so fresh clones booted unreachable — and converge can't fix that after
# the fact because converge needs ssh to connect. Force it enabled+started here
# so the *golden's own converge* (before capture) bakes an enabled sshd into the
# image → every clone comes up reachable on first boot. Classic ssh.service is
# more predictable for a fleet than socket activation (which also dropped our
# session when host keys were removed during sysprep).
- name: Enable and start SSH (classic always-on sshd, baked into the image)
  ansible.builtin.systemd:
    name: ssh.service
    enabled: true
    state: started
    masked: false

# --- purge the legacy golden self-provisioning ------------------------------
# The golden bakes a brittle first-boot self-restore (lab-zfs-restore.service +
# /usr/local/bin/lab-zfs-restore.sh, which created the pool and pulled homes from
# an http registry) plus its clipboard mount. Ansible owns pool-create + zfs recv
# now (roles/zfs), so tear the old path out — it's enabled on every clone and
# would race Ansible. Idempotent; also cleans the image after re-capture.
- name: Disable the legacy self-restore units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - lab-zfs-restore.service
    - mnt-cd108clipboard.mount
  failed_when: false

- name: Remove the legacy self-restore unit, script, and clipboard mount
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/lab-zfs-restore.service
    - /usr/local/bin/lab-zfs-restore.sh
    - /etc/systemd/system/mnt-cd108clipboard.mount
  register: legacy_purge

- name: Reload systemd after removing legacy units
  ansible.builtin.systemd:
    daemon_reload: true
  when: legacy_purge is changed

# mDNS: with the hostname set (below) each box advertises <hostname>.local,
# so the control node reaches it by name regardless of its DHCP-assigned IP.
- name: Enable and start Avahi (mDNS name advertising)
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started

- name: Install the professor's public key for passwordless admin SSH
  authorized_key:
    user: "{{ admin_user | default('daelt') }}"
    key: "{{ professor_ssh_pubkey }}"
  when: professor_ssh_pubkey is defined
  tags: deploykey

# --- image-owned deploy key (survives BOTH a home reset and a fresh image) --
# The key above lands in ~daelt/.ssh/authorized_keys, which lives on the ZFS
# home — NOT in the Clonezilla image, and absent on a freshly-imaged machine
# until the pool is built and homes are received. So ALSO drop the deploy key in
# an image-owned path sshd reads regardless of ZFS. Baked into the golden's ext4
# BEFORE capture, it ships in every clone → Ansible can reach a machine on first
# boot, before any zfs recv. This is the permanent fix for the first-connect
# chicken-egg (see docs/first-lab-test.md).
- name: Ensure the image-owned authorized_keys dir exists
  file: { path: /etc/ssh/authorized_keys.d, state: directory, mode: "0755" }
  tags: deploykey

- name: Bake the deploy key into the image-owned location
  copy:
    dest: "/etc/ssh/authorized_keys.d/{{ admin_user }}"
    content: "{{ professor_ssh_pubkey }}\n"
    owner: root
    group: root
    mode: "0644"
  when: professor_ssh_pubkey is defined
  tags: deploykey

- name: Point sshd at the image-owned keys too (in addition to ~/.ssh)
  copy:
    dest: /etc/ssh/sshd_config.d/10-image-authkeys.conf
    content: |
      # Read per-user keys from BOTH the ZFS home and the image-owned dir, so a
      # freshly-imaged machine (no ZFS homes yet) still accepts the deploy key.
      AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
    mode: "0644"
  notify: reload sshd
  tags: deploykey

# --- hostname (declarative, replaces the golden's set-hostname-from-mac.sh) -
# Name the host in inventory and Ansible applies it — no boot-time MAC script.
- name: Set the hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname_short }}"

# --- GRUB (headless, no grub-customizer) ---------------------------------
- name: Configure GRUB defaults
  lineinfile:
    path: /etc/default/grub
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: GRUB_TIMEOUT, value: "5" }
    - { key: GRUB_TIMEOUT_STYLE, value: menu }
  notify: update grub

# --- system tweaks (exact values confirmed from the golden) --------------
# Resolved at harvest: swap is an image-owned /swap.img swapfile; RTC is UTC
# (no set-local-rtc needed now Windows is a VM); no idle-shutdown cron exists;
# no /var/tmp symlink. IPv6 privacy extensions are off (use_tempaddr = 0).
- name: Disable IPv6 privacy extensions
  ansible.posix.sysctl:
    name: "net.ipv6.conf.{{ item }}.use_tempaddr"
    value: "0"
    sysctl_set: true
    state: present
    reload: true
  loop: [all, default]

# Wake-on-LAN: the NIC supports magic-packet wake but ships disabled. A udev
# rule is the standard persistent way (no dedicated Ansible module).
- name: Enable Wake-on-LAN (magic packet) via udev rule
  copy:
    dest: /etc/udev/rules.d/70-wol.rules
    content: |
      ACTION=="add", SUBSYSTEM=="net", NAME=="{{ wol_interface }}", RUN+="/usr/sbin/ethtool -s {{ wol_interface }} wol g"
  when: wol_interface | length > 0
  notify: reload udev

# TODO(harvest): udev rule giving the practice UART kits a STABLE /dev symlink.
#   ST-Link/J-Link/OpenOCD rules come from their -udev-rules packages already;
#   this is only for the generic serial kits. Needs idVendor/idProduct from a
#   plugged-in kit: `udevadm info -a -n /dev/ttyUSB0 | grep -m2 'idVendor\|idProduct'`

# --- Boot beacon (phone-home) ---------------------------------------------
# Each machine POSTs its identity to the hub on boot so the fleet can be
# reconciled against the static inventory (relocated / unknown / silent
# machines). Best-effort — never blocks or fails the boot. The receiver lives
# on the server (roles/server); reconcile with scripts/scan-beacons.py.
- name: Install the boot-beacon reporter
  copy:
    dest: /usr/local/bin/phone-home
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Boot beacon -> lab hub. Best-effort: never blocks or fails the boot.
      set -u
      URL="${PHONE_HOME_URL:-http://{{ server_host }}:{{ phone_home_port | default(8888) }}/boot}"
      host=$(hostname)
      mid=$(cat /etc/machine-id 2>/dev/null || true)
      ip=$(ip -o route get 1.1.1.1 2>/dev/null | sed -n 's/.* src \([0-9.]*\).*/\1/p' | head -1)
      ts=$(date -Is)
      macs=$(ip -o link show up 2>/dev/null \
        | awk -F'link/ether ' '/link\/ether/{split($2,a," "); m[++n]=a[1]} \
            END{s="["; for(i=1;i<=n;i++) s=s (i>1?",":"") "\"" m[i] "\""; print s "]"}')
      [ -z "$macs" ] && macs="[]"
      payload=$(printf '{"hostname":"%s","machine_id":"%s","macs":%s,"ip":"%s","ts":"%s"}' \
        "$host" "$mid" "$macs" "$ip" "$ts")
      curl -fsS --max-time 5 -H 'Content-Type: application/json' --data "$payload" "$URL" >/dev/null 2>&1 || true
      exit 0

- name: Install the boot-beacon systemd unit
  copy:
    dest: /etc/systemd/system/phone-home.service
    mode: "0644"
    content: |
      [Unit]
      Description=Phone home to the lab hub on boot (best-effort machine beacon)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/phone-home

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd so it sees the new phone-home unit
  ansible.builtin.systemd:
    daemon_reload: true

# `--check` can't create the unit above, so enabling it would fail with
# "Could not find the requested service" in a dry run — skip it there.
- name: Enable the boot beacon
  ansible.builtin.systemd:
    name: phone-home.service
    enabled: true
  when: not ansible_check_mode

# --- Auto-sleep: let the hub trigger power actions over SSH -----------------
# The nightly auto-sleep timer on the server SSHes in as {{ admin_user }} and
# runs `sudo systemctl suspend`. Allow just the power verbs without a password
# (scoped — not blanket sudo). See roles/server for the timer.
- name: Allow the admin user to suspend/poweroff without a password (for the hub's auto-sleep)
  copy:
    dest: /etc/sudoers.d/30-autosleep
    mode: "0440"
    content: |
      # Managed by Ansible (roles/common). Lets the hub's nightly auto-sleep
      # timer sleep/shut this machine over SSH. Power verbs only.
      {{ admin_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl suspend, /usr/bin/systemctl poweroff, /usr/bin/systemctl hibernate, /usr/bin/systemctl suspend-then-hibernate
    validate: /usr/sbin/visudo -cf %s
