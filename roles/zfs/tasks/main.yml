---
# Clonezilla images the ext4 Ubuntu; the REST of the disk is ZFS that Ansible
# builds (Clonezilla can't do ZFS). On the golden the pool is `ssdpool` (sda4),
# with per-course homes under ssdpool/home (each with a `Downloads` child so
# bulky downloads survive a reset) and the emergency Windows VM at
# ssdpool/windows. A converge REBUILDS the pool from the golden: if a stale
# (not-imported) pool is left on the target, it's clobbered and recreated — see
# the chainsaw note below. The per-home *reset* on a live pool lives in
# reset-homes.yml.

- name: Install ZFS + sanoid (snapshots) + send/recv throughput tools
  apt:
    name:
      - zfsutils-linux
      - sanoid            # golden uses sanoid/syncoid, NOT zfs-auto-snapshot
      - mbuffer
      - pv
      - lzop
    state: present
    update_cache: true

- name: Check whether the pool already exists
  command: "zpool list -H -o name {{ zfs_pool }}"
  register: zpool_check
  failed_when: false
  changed_when: false

# Clonezilla leaves {{ zfs_data_device }} as an UNFORMATTED labeled partition.
# Probe it: a fresh restore is blank, but a RE-imaged disk still carries the old
# `ssdpool` (sgdisk --zap-all in the restore script clears the partition TABLE,
# not the partition CONTENTS), so blkid reports TYPE="zfs_member".
- name: Probe the ZFS target for an existing filesystem/signature
  command: "blkid -p {{ zfs_data_device }}"
  register: zfs_target_blkid
  failed_when: false
  changed_when: false

# CHAINSAW (authorized): a converge must be able to restore the golden onto a
# re-imaged machine, so when a stale, not-currently-imported pool is found we
# CLOBBER it and recreate rather than refuse. Re-imaging a disk means its old
# data is meant to be gone — that's the point. This only fires when the pool is
# NOT active (zpool_check.rc != 0); a live, imported ssdpool is never touched
# here (per-home resets go through reset-homes.yml).
- name: Clobber a stale (not-imported) pool left on the target, if any
  when: zpool_check.rc != 0 and zfs_target_blkid.rc == 0
  block:
    - name: Force-import the stale pool so it can be cleanly destroyed
      command: "zpool import -f -N {{ zfs_pool }}"
      register: stale_import
      failed_when: false
      changed_when: stale_import.rc == 0

    - name: Destroy the stale pool
      command: "zpool destroy -f {{ zfs_pool }}"
      when: stale_import.rc == 0
      changed_when: true

    - name: Wipe any residual ZFS labels/signatures off the target
      command: "wipefs -a {{ zfs_data_device }}"
      changed_when: true

# Create over a blank partition, or over one we just clobbered above. -f is
# belt-and-suspenders in case a residual label survived wipefs.
- name: Create the ZFS pool on the (now-empty) partition
  command: "zpool create -f {{ zfs_pool }} {{ zfs_data_device }}"
  when: zpool_check.rc != 0

# --- snapshots: sanoid config (golden shipped an EMPTY sanoid.conf) --------
- name: Ensure the sanoid config dir exists
  file: { path: /etc/sanoid, state: directory, mode: "0755" }

- name: Template the sanoid retention policy
  template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    mode: "0644"

# --- initial receive of the golden datasets --------------------------------
# Sent from the server, at most `zfs_send_concurrency` machines at a time
# (task `throttle`): as each host finishes its receive, the next one starts.
# mbuffer is a plain stream buffer here (decouples send/recv over ssh) — no
# rate cap. Course homes carry their `Downloads` child, so the send is -R.
# Recv targets are ssdpool/home/<user>, so the parent dataset must exist first —
# the pool root exists, but ssdpool/home does not on a fresh clone.
- name: Does the parent home dataset exist?
  command: "zfs list -H -o name {{ zfs_pool }}/home"
  register: home_parent
  failed_when: false
  changed_when: false

- name: Create the parent home dataset (mounted at /home)
  command: "zfs create -o mountpoint=/home {{ zfs_pool }}/home"
  when: home_parent.rc != 0

# --- server → client push transport ---------------------------------------
# The recv is pushed from the server: `zfs send | ssh <client> "zfs recv"`. The
# naive form sshed to the bare inventory name (unresolvable) as root with no key.
# Instead reach the client at {{ ansible_host }} as {{ admin_user }} with the
# deploy key it already trusts, and delegate recv to {{ admin_user }} on the
# client via `zfs allow` — no root SSH. Non-root can't MOUNT on Linux, so recv
# with -u and let root set mountpoints + mount afterwards.
- name: Let {{ admin_user }} receive into the pool (delegated, so the push needs no root SSH)
  command: >
    zfs allow -u {{ admin_user }}
    create,receive,mount,mountpoint,userprop,snapshot,hold,destroy,rollback
    {{ zfs_pool }}
  changed_when: false

- name: Which course homes are already received?
  command: "zfs list -H -o name {{ zfs_pool }}/home/{{ item }}"
  register: home_present
  failed_when: false
  changed_when: false
  loop: "{{ discipline_users }}"
  loop_control: { label: "{{ item }}" }

# -p (properties) NOT -R (recursive): send the home dataset with its properties
# but WITHOUT its Downloads child. Downloads is course junk (e.g. 8 GB in one
# home) that must not ride to every machine — each gets a fresh empty Downloads
# below. -R would drag it along.
- name: Initial receive of course homes from the server (N at a time, no Downloads)
  shell: >-
    zfs send -p {{ zfs_pool_server }}/golden/home/{{ item.item }}@{{ golden_snapshot }}
    | mbuffer -q
    | ssh -i {{ deploy_key_on_server }} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ admin_user }}@{{ ansible_host | default(inventory_hostname) }} "zfs recv -u -F {{ zfs_pool }}/home/{{ item.item }}"
  delegate_to: "{{ server_host }}"
  throttle: "{{ zfs_send_concurrency }}"
  when: item.rc != 0
  loop: "{{ home_present.results }}"
  loop_control: { label: "{{ item.item }}" }

- name: Is the Windows emergency VM already received?
  command: "zfs list -H -o name {{ zfs_pool }}/windows"
  register: win_present
  failed_when: false
  changed_when: false

# -R (replication stream) so ALL the windows snapshots ride along — critically
# @{{ winvm_revert_snapshot | default('ltspice') }}, the clean baseline the winvm
# role reverts to. A plain send of @golden would ship only that one snapshot and
# the revert wiring would fail ("clean-baseline snapshot does not exist").
- name: Initial receive of the Windows emergency VM (with its snapshots)
  shell: >-
    zfs send -R {{ zfs_pool_server }}/golden/windows@{{ golden_snapshot }}
    | mbuffer -q
    | ssh -i {{ deploy_key_on_server }} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ admin_user }}@{{ ansible_host | default(inventory_hostname) }} "zfs recv -u -F {{ zfs_pool }}/windows"
  delegate_to: "{{ server_host }}"
  when: win_present.rc != 0

# The `-R` receive carries the golden's EXPLICIT mountpoint (…/golden/windows),
# so ssdpool/windows lands at /mnt/ssdpool/golden/windows — but the libvirt
# domain + winvm_disk_path expect the qcow2 at {{ winvm_disk_path }}. Homes get
# this same golden-mountpoint reset above; the Windows dataset was missed, so the
# VM failed to start ("Cannot access storage file …/ssdpool/windows/windows.qcow2:
# No such file"). Pin it to the canonical mountpoint (only when wrong — a
# `zfs set mountpoint` forces an unmount+remount that errors "busy" if the VM
# disk is open, matching the guard pattern used for the homes).
- name: Does the Windows dataset exist now (received or pre-existing)?
  command: "zfs list -H -o name {{ zfs_pool }}/windows"
  register: win_now
  failed_when: false
  changed_when: false

- name: Pin the Windows dataset to its canonical mountpoint + mount it
  when: win_now.rc == 0
  block:
    - name: Read the Windows dataset's current mountpoint
      command: "zfs get -H -o value mountpoint {{ zfs_pool }}/windows"
      register: win_mp
      changed_when: false

    - name: Point ssdpool/windows at {{ winvm_disk_path | dirname }} (only if wrong)
      command: "zfs set mountpoint={{ winvm_disk_path | dirname }} {{ zfs_pool }}/windows"
      when: win_mp.stdout | trim != (winvm_disk_path | dirname)

    - name: Ensure the Windows dataset is mounted
      command: "zfs mount {{ zfs_pool }}/windows"
      register: win_mount
      changed_when: win_mount.rc == 0
      failed_when: win_mount.rc != 0 and 'already mounted' not in win_mount.stderr

# The golden's home datasets carry explicit mountpoints (…/golden/home/<user>);
# reset them to inherit so they land at /home/<course>, then mount (root — recv
# ran with -u because non-root can't mount on Linux). `zfs inherit` forces an
# unmount+remount, which fails ("dataset is busy") on a re-converge while a
# course user is logged in (broke cd106-05's resume, 2026-07-15) — so check the
# effective mountpoint first and only inherit when it's actually wrong.
- name: Read each home's current mountpoint
  command: "zfs get -H -o value mountpoint {{ zfs_pool }}/home/{{ item }}"
  register: home_mp_value
  changed_when: false
  loop: "{{ discipline_users }}"
  loop_control: { label: "{{ item }}" }

- name: Reset received homes to inherit the /home mountpoint (only when wrong)
  command: "zfs inherit -r mountpoint {{ zfs_pool }}/home/{{ item.item }}"
  when: item.stdout | trim != '/home/' + item.item
  loop: "{{ home_mp_value.results }}"
  loop_control: { label: "{{ item.item }}" }

# `zfs set mountpoint=/home` FORCES an unmount+remount, which fails ("pool or
# dataset is busy") on a re-run once /home and its child home datasets are already
# mounted. So only set it when it's actually wrong, then mount idempotently
# (`zfs mount -a` mounts what's missing and skips what's already mounted).
- name: Read ssdpool/home's current mountpoint
  command: "zfs get -H -o value mountpoint {{ zfs_pool }}/home"
  register: home_mountpoint
  changed_when: false

- name: Point ssdpool/home at /home (only if it isn't already — avoids a busy remount)
  command: "zfs set mountpoint=/home {{ zfs_pool }}/home"
  when: home_mountpoint.stdout | trim != '/home'

# -O (overlay) everywhere: useradd (common role) pre-creates /home/<user> with
# its skeleton on the ext4 root BEFORE the pool exists, and plain `zfs mount`
# refuses non-empty mountpoints — which is why homes showed up EMPTY (skeleton)
# after a reboot on 2026-07-14. Overlay at converge time here, and via a
# drop-in for boot-time zfs-mount.service below.
- name: Mount all received home datasets (idempotent, overlay over skeletons)
  command: "zfs mount -aO"
  changed_when: false

- name: Drop-in dir for zfs-mount.service
  file: { path: /etc/systemd/system/zfs-mount.service.d, state: directory, mode: "0755" }

- name: Overlay-mount at boot too (zfs-mount.service drop-in)
  ansible.builtin.copy:
    dest: /etc/systemd/system/zfs-mount.service.d/override.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/zfs). -O = overlay-mount: the course homes
      # mount over non-empty useradd skeleton dirs; without it every boot
      # leaves /home/<user> showing the empty ext4 skeleton.
      [Service]
      ExecStart=
      ExecStart=/sbin/zfs mount -aO
  register: zfs_mount_dropin

- name: Reload systemd after the zfs-mount drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  when: zfs_mount_dropin.changed

# Downloads is deliberately NOT synced from the golden (see the -p send above).
# Give each course a fresh EMPTY Downloads dataset instead, owned by its user.
- name: Which per-user Downloads datasets already exist?
  command: "zfs list -H -o name {{ zfs_pool }}/home/{{ item }}/Downloads"
  register: downloads_present
  failed_when: false
  changed_when: false
  loop: "{{ discipline_users }}"
  loop_control: { label: "{{ item }}" }

- name: Create an empty Downloads dataset per course (not synced from golden)
  command: "zfs create {{ zfs_pool }}/home/{{ item.item }}/Downloads"
  when: item.rc != 0
  loop: "{{ downloads_present.results }}"
  loop_control: { label: "{{ item.item }}" }

- name: Own each Downloads dir to its course user
  ansible.builtin.file:
    path: "/home/{{ item }}/Downloads"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
  loop: "{{ discipline_users }}"

# Chrome/Chromium won't start when its profile carries a SingletonLock that names
# a DIFFERENT host: it assumes the profile is open "on another computer", locks
# it, and exits — silently, because it can't draw the warning dialog in a fresh
# session (only "Unable to show message box" hits the log). Every course/admin
# home is ZFS-cloned from the golden (authored on cd108-flashtest), so each
# ~/.config/google-chrome ships `SingletonLock -> cd108-flashtest-<pid>` → chrome
# dies on first launch on every clone. Clear ONLY cross-host locks: a lock naming
# THIS host is a live local Chrome and must be left alone. Idempotent (nothing to
# do once the stale locks are gone) and runs here because homes are mounted only
# after the receive above (the desktop role runs before zfs).
- name: Clear stale cross-host Chrome/Chromium SingletonLock from the cloned homes
  shell: |
    changed=0
    host=$(hostname)
    for u in {{ ([admin_user] + discipline_users) | join(' ') }}; do
      for cfg in "/home/$u/.config/google-chrome" "/home/$u/.config/chromium"; do
        lock="$cfg/SingletonLock"
        [ -L "$lock" ] || continue
        tgt=$(readlink "$lock")
        if [ "${tgt%-*}" != "$host" ]; then
          rm -f "$cfg/SingletonLock" "$cfg/SingletonCookie" "$cfg/SingletonSocket"
          changed=1
        fi
      done
    done
    echo "changed=$changed"
  register: chrome_singleton
  changed_when: "'changed=1' in chrome_singleton.stdout"
