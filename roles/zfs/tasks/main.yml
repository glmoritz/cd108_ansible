---
# Clonezilla images the ext4 Ubuntu; the REST of the disk is ZFS that Ansible
# builds (Clonezilla can't do ZFS). On the golden the pool is `ssdpool` (sda4),
# with per-course homes under ssdpool/home (each with a `Downloads` child so
# bulky downloads survive a reset) and the emergency Windows VM at
# ssdpool/windows. A converge REBUILDS the pool from the golden: if a stale
# (not-imported) pool is left on the target, it's clobbered and recreated — see
# the chainsaw note below. The per-home *reset* on a live pool lives in
# reset-homes.yml.

- name: Install ZFS + sanoid (snapshots) + send/recv throughput tools
  apt:
    name:
      - zfsutils-linux
      - sanoid            # golden uses sanoid/syncoid, NOT zfs-auto-snapshot
      - mbuffer
      - pv
      - lzop
    state: present
    update_cache: true

- name: Check whether the pool already exists
  command: "zpool list -H -o name {{ zfs_pool }}"
  register: zpool_check
  failed_when: false
  changed_when: false

# Clonezilla leaves {{ zfs_data_device }} as an UNFORMATTED labeled partition.
# Probe it: a fresh restore is blank, but a RE-imaged disk still carries the old
# `ssdpool` (sgdisk --zap-all in the restore script clears the partition TABLE,
# not the partition CONTENTS), so blkid reports TYPE="zfs_member".
- name: Probe the ZFS target for an existing filesystem/signature
  command: "blkid -p {{ zfs_data_device }}"
  register: zfs_target_blkid
  failed_when: false
  changed_when: false

# CHAINSAW (authorized): a converge must be able to restore the golden onto a
# re-imaged machine, so when a stale, not-currently-imported pool is found we
# CLOBBER it and recreate rather than refuse. Re-imaging a disk means its old
# data is meant to be gone — that's the point. This only fires when the pool is
# NOT active (zpool_check.rc != 0); a live, imported ssdpool is never touched
# here (per-home resets go through reset-homes.yml).
- name: Clobber a stale (not-imported) pool left on the target, if any
  when: zpool_check.rc != 0 and zfs_target_blkid.rc == 0
  block:
    - name: Force-import the stale pool so it can be cleanly destroyed
      command: "zpool import -f -N {{ zfs_pool }}"
      register: stale_import
      failed_when: false
      changed_when: stale_import.rc == 0

    - name: Destroy the stale pool
      command: "zpool destroy -f {{ zfs_pool }}"
      when: stale_import.rc == 0
      changed_when: true

    - name: Wipe any residual ZFS labels/signatures off the target
      command: "wipefs -a {{ zfs_data_device }}"
      changed_when: true

# Create over a blank partition, or over one we just clobbered above. -f is
# belt-and-suspenders in case a residual label survived wipefs.
- name: Create the ZFS pool on the (now-empty) partition
  command: "zpool create -f {{ zfs_pool }} {{ zfs_data_device }}"
  when: zpool_check.rc != 0

# --- snapshots: sanoid config (golden shipped an EMPTY sanoid.conf) --------
- name: Ensure the sanoid config dir exists
  file: { path: /etc/sanoid, state: directory, mode: "0755" }

- name: Template the sanoid retention policy
  template:
    src: sanoid.conf.j2
    dest: /etc/sanoid/sanoid.conf
    mode: "0644"

# --- server → client push transport ---------------------------------------
# The recv is pushed from the server: `zfs send | ssh <client> "zfs recv"`. The
# naive form sshed to the bare inventory name (unresolvable) as root with no key.
# Instead reach the client at {{ ansible_host }} as {{ admin_user }} with the
# deploy key it already trusts, and delegate recv to {{ admin_user }} on the
# client via `zfs allow` — no root SSH. Non-root can't MOUNT on Linux, so recv
# with -u and let root set mountpoints + mount afterwards.
- name: Let {{ admin_user }} receive into the pool (delegated, so the push needs no root SSH)
  command: >
    zfs allow -u {{ admin_user }}
    create,receive,mount,mountpoint,userprop,snapshot,hold,destroy,rollback
    {{ zfs_pool }}
  changed_when: false

# --- Windows emergency VM (the received golden one) -------------------------
# Off where the room has no Windows VM (ca307: lab_windows_vm: false) — then the
# winvm role is skipped too (site.yml).
- name: Receive + mount the Windows emergency VM
  ansible.builtin.include_tasks: windows.yml
  when: lab_windows_vm | default(true) | bool

# --- course homes (the received golden ones) ------------------------------
# Off for rooms whose users are FreeIPA accounts with fresh NFS homes (ca307:
# zfs_receive_homes: false). There /home belongs to autofs, so nothing here may
# create, mount or re-point ssdpool/home over it.
- name: Receive + mount the golden course homes
  ansible.builtin.include_tasks: homes.yml
  when: zfs_receive_homes | default(true) | bool
