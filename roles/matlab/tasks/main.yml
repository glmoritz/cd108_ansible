---
# MATLAB is a LOCAL install (image-owned binary at {{ matlab_root }}) using a
# campus NETWORK license (FlexLM). Ansible's only job is to point it at the
# license server. Students run it as the `estudante` account.
#
# The role is a no-op on machines that don't ship MATLAB, so it can stay in the
# labs converge and light up wherever the binary is present.

- name: Check whether MATLAB is installed on this machine
  stat:
    path: "{{ matlab_root }}"
  register: matlab_dir

- name: Point local MATLAB at the campus network license
  when: matlab_dir.stat.exists
  block:
    - name: Ensure the MATLAB licenses dir exists
      file:
        path: "{{ matlab_root }}/licenses"
        state: directory
        mode: "0755"

    - name: Write the network license pointer
      copy:
        dest: "{{ matlab_root }}/licenses/network.lic"
        content: "{{ matlab_license_server }}"
        mode: "0644"

    # The golden had a custom system launcher (MATLAB isn't packaged with one).
    - name: Deploy the MATLAB desktop launcher
      copy:
        dest: /usr/share/applications/matlab.desktop
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=MATLAB {{ matlab_root | basename }}
          Exec={{ matlab_root }}/bin/matlab -desktop -softwareopengl
          Icon={{ matlab_root }}/bin/glnxa64/cef_resources/matlab_icon.png
          Terminal=false
          Categories=Development;Science;
          StartupNotify=true
