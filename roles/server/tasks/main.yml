---
# The professor's PC: infra hub. No Samba, no Squid (both dropped as messy).
# Just NFS: the shared "troca" exchange folder + it holds the golden datasets.

- name: Install NFS server, apt cache, and Wake-on-LAN sender
  apt:
    name:
      - nfs-kernel-server
      - apt-cacher-ng      # apt proxy: clients fetch each package once, then cache
      - wakeonlan
    state: present
    update_cache: true

# Public free-for-all exchange folder. Mode 1777 = sticky bit: everyone can
# create files, but you can only delete files YOU own — so a professor's files
# can't be deleted by students. Same semantics as /tmp.
- name: Create the shared exchange folder (sticky)
  file:
    path: "{{ nfs_exchange_dir }}"
    state: directory
    mode: "1777"

- name: Export the exchange folder over NFS
  lineinfile:
    path: /etc/exports
    line: "{{ nfs_exchange_dir }} {{ nfs_export_clients }}(rw,sync,no_subtree_check)"
    create: true
    mode: "0644"
  notify: reload nfs exports

# --- ZFS: the pool + container holding the golden datasets students receive -
# The golden trees themselves (…/golden/home/<course>, …/golden/windows) are
# populated by a one-time harvest from the reference machine (harvest-golden.yml),
# then snapshotted @{{ golden_snapshot }}; roles/zfs sends them to students.
- name: Install ZFS + stream buffer on the server
  apt:
    name: [zfsutils-linux, mbuffer]
    state: present

- name: Check whether the server pool exists
  command: "zpool list -H -o name {{ zfs_pool_server }}"
  register: srv_zpool
  failed_when: false
  changed_when: false
  check_mode: false          # read-only; must run even in --check

- name: Probe the server data device for an existing filesystem/signature
  command: "blkid -p {{ server_zfs_device }}"
  register: srv_blkid
  failed_when: false
  changed_when: false
  check_mode: false          # read-only; must run even in --check

# Cheap insurance: never zpool-create over a disk that already has data.
- name: Refuse to create the server pool if the data device is not empty
  fail:
    msg: >-
      {{ server_zfs_device }} already contains data ({{ srv_blkid.stdout }}).
      Refusing to zpool create. Verify the disk before continuing.
  when: srv_zpool.rc != 0 and srv_blkid.rc == 0

- name: Create the server ZFS pool on the blank data disk
  command: >-
    zpool create -o ashift=12 -O compression=zstd
    -O mountpoint=/mnt/{{ zfs_pool_server }} {{ zfs_pool_server }} {{ server_zfs_device }}
  when: srv_zpool.rc != 0 and srv_blkid.rc != 0

- name: Golden container dataset (parent of the per-course + windows goldens)
  command: "zfs create -o mountpoint=/mnt/{{ zfs_pool_server }}/golden {{ zfs_pool_server }}/golden"
  args:
    creates: "/mnt/{{ zfs_pool_server }}/golden"

# NFS-share the golden tree the ZFS way (matches the clipboard dataset). Children
# inherit; students also pull via zfs send/recv over SSH (see roles/zfs).
- name: NFS-share the golden datasets (sharenfs, scoped to the lab net)
  community.general.zfs:
    name: "{{ zfs_pool_server }}/golden"
    state: present
    extra_zfs_properties:
      sharenfs: "{{ nfs_share_acl }}"

# --- Boot-beacon receiver --------------------------------------------------
# Logs one JSONL line per node phone-home POST to /var/log/phone-home/beacons.jsonl
# (server adds recv_ts + source IP). stdlib Python, no deps; systemd DynamicUser
# with a source-IP allowlist ({{ phone_home_allowed }}). Reporter is baked into
# every machine by roles/common; reconcile with scripts/scan-beacons.py.
- name: Directory for the boot-beacon receiver
  file:
    path: /opt/phone-home
    state: directory
    mode: "0755"

- name: Install the boot-beacon receiver
  copy:
    dest: /opt/phone-home/receiver.py
    mode: "0755"
    content: |
      #!/usr/bin/env python3
      """cd108 boot-beacon receiver: append one JSONL line per node POST /boot."""
      import json, os, ipaddress
      from datetime import datetime, timezone
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      PORT = int(os.environ.get("PHONE_HOME_PORT", "8888"))
      LOG = os.environ.get("PHONE_HOME_LOG", "/var/log/phone-home/beacons.jsonl")
      ALLOWED = [ipaddress.ip_network(n.strip()) for n in
                 os.environ.get("PHONE_HOME_ALLOWED",
                                "103.0.0.0/19,192.168.122.0/24,127.0.0.0/8").split(",")
                 if n.strip()]

      def allowed(ip):
          try:
              a = ipaddress.ip_address(ip)
          except ValueError:
              return False
          return any(a in n for n in ALLOWED)

      class H(BaseHTTPRequestHandler):
          def _reply(self, code, msg=b"ok\n"):
              self.send_response(code)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(msg)))
              self.end_headers()
              self.wfile.write(msg)

          def do_POST(self):
              src = self.client_address[0]
              if not allowed(src):
                  return self._reply(403, b"forbidden\n")
              if self.path != "/boot":
                  return self._reply(404, b"not found\n")
              try:
                  n = int(self.headers.get("Content-Length", 0) or 0)
              except ValueError:
                  n = 0
              if n <= 0 or n > 65536:
                  return self._reply(400, b"bad length\n")
              try:
                  beacon = json.loads(self.rfile.read(n) or b"{}")
              except Exception:
                  return self._reply(400, b"bad json\n")
              rec = {"recv_ts": datetime.now(timezone.utc).isoformat(),
                     "src_ip": src, "beacon": beacon}
              os.makedirs(os.path.dirname(LOG), exist_ok=True)
              with open(LOG, "a") as f:
                  f.write(json.dumps(rec, ensure_ascii=False) + "\n")
              self._reply(200)

          def log_message(self, *a):
              pass

      if __name__ == "__main__":
          ThreadingHTTPServer(("0.0.0.0", PORT), H).serve_forever()
  notify: restart phone-home receiver

- name: Install the boot-beacon receiver unit
  copy:
    dest: /etc/systemd/system/phone-home-receiver.service
    mode: "0644"
    content: |
      [Unit]
      Description=cd108 boot-beacon receiver (logs node phone-home POSTs)
      After=network.target

      [Service]
      Environment=PHONE_HOME_PORT={{ phone_home_port | default(8888) }}
      Environment=PHONE_HOME_ALLOWED={{ phone_home_allowed | default('103.0.0.0/19,192.168.122.0/24,127.0.0.0/8') }}
      ExecStart=/usr/bin/python3 /opt/phone-home/receiver.py
      DynamicUser=yes
      LogsDirectory=phone-home
      Restart=always
      RestartSec=2
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes

      [Install]
      WantedBy=multi-user.target
  notify: restart phone-home receiver

- name: Enable + start the boot-beacon receiver
  ansible.builtin.systemd:
    name: phone-home-receiver.service
    enabled: true
    state: started
    daemon_reload: true
