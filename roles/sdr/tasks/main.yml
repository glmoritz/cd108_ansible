---
# SDR toolchain. Decision (2026-07-15, REVERSES build-once-distribute): compile
# SDR++ ON EACH lab machine. The server runs 26.04 while the labs run 24.04 —
# a server-built artifact ships plugins linked against glibc 2.43 / volk 3.3 /
# librtlsdr.so.0, none of which noble provides (verified broken on cd106-05:
# every source plugin failed to link). The labs already carry libuhd 4.10 from
# the golden's baked ettus PPA, so local builds link cleanly against what's
# actually installed. Build deps ride in sdr_packages; the compile is a one-off
# ~10 min per machine (creates-guarded on the build tree).

# The ettus PPA is added HERE (the one authoritative place). The golden also bakes
# its own copy (ettusresearch-ubuntu-uhd-noble.sources, inline key) — that baked
# .sources conflicts with this one on Signed-By, so the common role's dedup removes
# it (alongside docker/vscode/chrome), leaving this ppa: add as the single source.
#
# BEST-EFFORT: `ppa:` fetches the signing key from hkp://keyserver.ubuntu.com:80,
# which the campus captive portal blocks ("Unable to get required signing key").
# Don't fail the converge on it — UHD is also in Ubuntu universe, and where the
# golden baked the repo it already works. TODO: bundle the ettus key in
# roles/sdr/files and add via signed-by so it's portal-independent.
- name: Add Ettus Research UHD PPA (best-effort — keyserver may be portal-blocked)
  block:
    - name: Add Ettus Research UHD PPA
      apt_repository: { repo: "ppa:ettusresearch/uhd", state: present }
  rescue:
    - name: Note the ettus PPA could not be added
      ansible.builtin.debug:
        msg: >-
          Could not add ppa:ettusresearch/uhd (signing-key fetch failed — keyserver
          blocked by the captive portal). Continuing; UHD comes from Ubuntu universe
          or the golden's baked repo. Bundle the key for a portal-independent fix.

- name: Install SDR libraries + build deps
  apt:
    name: "{{ sdr_packages }}"
    state: present
    update_cache: true

- name: Blacklist the DVB driver so the RTL-SDR dongle is usable
  copy:
    dest: /etc/modprobe.d/blacklist-rtl.conf
    content: "blacklist dvb_usb_rtl28xxu\n"
  notify: unload dvb_usb_rtl28xxu

# ------------------- build + install SDR++ locally -------------------
# All three fetches below tunnel through the lab cacher: the campus captive
# portal MITMs direct client HTTPS (cert *.ct.utfpr.edu.br), same as the
# keyrings in roles/common. github.com and files.ettus.com are in the server's
# PassThroughPattern (roles/server).
- name: Clone SDR++ source
  git: { repo: "https://github.com/AlexandreRouma/SDRPlusPlus.git", dest: /usr/local/src/SDRPlusPlus }
  environment: { https_proxy: "{{ apt_proxy_url }}" }

# Guard on the BUILD-TREE binary, not /usr/bin/sdrpp: machines that received
# the (broken) server-built tarball already have /usr/bin/sdrpp and must still
# rebuild; only a machine that compiled locally has build/sdrpp.
- name: Compile and install SDR++ (once)
  shell: |
    cmake -B build -DOPT_BUILD_USRP_SOURCE=ON
    cmake --build build -j"$(nproc)"
    cmake --install build
  args: { chdir: /usr/local/src/SDRPlusPlus, creates: /usr/local/src/SDRPlusPlus/build/sdrpp }

# MIGRATION (2026-07-15, remove once the fleet has re-converged): the abandoned
# build-once-distribute flow unpacked the SERVER's (26.04) /usr/share/uhd/4.9.0
# images tree onto clients — ~200 MB in a version dir noble's UHD never reads,
# and it poisons the images-dir discovery below. The dir only ever came from
# that tarball; no noble package ships it.
- name: Remove the stray server-version UHD images dir (old tarball distribution)
  file: { path: /usr/share/uhd/4.9.0, state: absent }

# Only the B2xx bitstreams are needed (the lab's LibreSDR B210 clones; RTL-SDR
# dongles need no image) — the full image set is ~500 MB, the b2xx subset ~20 MB.
# The downloader keeps an inventory.json and skips targets that are already
# current, so re-runs are cheap.
- name: Download UHD B2xx FPGA/firmware images
  command: uhd_images_downloader -t b2xx
  environment: { https_proxy: "{{ apt_proxy_url }}" }
  register: uhd_dl
  changed_when: "'Downloading' in (uhd_dl.stdout | default(''))"

- name: Clone LibreSDR firmware repo
  git: { repo: "https://github.com/alphafox02/LibreSDR_USRP", dest: /usr/local/src/LibreSDR_USRP }
  environment: { https_proxy: "{{ apt_proxy_url }}" }

# The images dir varies by UHD packaging (/usr/share/uhd/images on the PPA,
# /usr/share/uhd/<ver>/images on some distro builds) — discover, don't hardcode.
- name: Locate the UHD images directory (version-independent)
  find: { paths: /usr/share/uhd, patterns: images, file_type: directory, recurse: true }
  register: uhd_images

# Upstream's patch.sh overwrites every usrp_b210_fpga.bin with their
# libresdr_b210.bin — the custom FPGA bitstream is the whole point of the
# repo (the USB firmware .hex is stock and already comes from
# uhd_images_downloader).
- name: Install the LibreSDR B210 FPGA image into the UHD images dir
  copy:
    src: /usr/local/src/LibreSDR_USRP/libresdr_b210.bin
    dest: "{{ (uhd_images.files | map(attribute='path') | first) }}/usrp_b210_fpga.bin"
    remote_src: true
  when: uhd_images.files | length > 0

# ------------------ launcher (built from source, no packaged .desktop) --
- name: Deploy the SDR++ desktop launcher
  copy:
    dest: /usr/share/applications/sdrpp.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Encoding=UTF-8
      Version=1.0
      Type=Application
      Terminal=false
      Exec=/usr/bin/sdrpp
      Name=SDR++
      Icon=/usr/share/sdrpp/icons/sdrpp.png
      Categories=HamRadio;
