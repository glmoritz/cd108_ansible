---
# Normal converge. Safe to re-run. Does NOT reset homes (see reset-homes.yml).
# Run on the server VM (ssh <you>@cd108.tutu.eng.br; cd /srv/cd108_ansible). Always dry-run ONE machine first:
#   ansible-playbook site.yml --limit cd108-21 --check --diff \
#     --vault-password-file /etc/cd108/vault_pass --become-password-file /etc/cd108/vault_pass
# Roles are tagged so you can converge incrementally, e.g. --tags common,zfs
- name: Server — infra hub (student machine on steroids)
  hosts: server
  roles:
    - { role: common,  tags: common }   # base CLI only (no desktop role → no GUI)
    - { role: server,  tags: server }   # apt-cache, NFS troca, golden ZFS store

- name: All lab machines
  hosts: labs
  roles:
    - { role: common,  tags: common }
    - { role: desktop, tags: desktop }
    - { role: zfs,     tags: zfs }      # build pool + receive homes/windows from server
    - { role: winvm,   tags: winvm, when: "lab_windows_vm | default(true) | bool" }  # Windows VM: revert wiring + launcher (needs ssdpool/windows)
    - { role: sdr,     tags: sdr }
    - { role: matlab,  tags: matlab }
    - { role: freeipa, tags: freeipa, when: "inventory_hostname in groups['freeipa_members']" }
