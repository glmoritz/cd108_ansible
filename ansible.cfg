[defaults]
# Directory inventory: static hierarchy (hosts.yml) + the dynamic registry
# reader (lab_hosts.py). group_vars/ inside it is honoured; both are merged.
inventory = inventory/
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
