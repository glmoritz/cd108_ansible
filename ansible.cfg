[defaults]
# Static inventory directory: hosts.yml + group_vars/ (both honoured).
inventory = inventory/
roles_path = roles
filter_plugins = filter_plugins
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# YAML-formatted output. The old `yaml` stdout callback (community.general.yaml)
# was removed in community.general 12 / ansible-core 2.13+; use the built-in
# default callback with result_format=yaml instead.
stdout_callback = default
result_format = yaml
# Freshly-imaged machines have NO home for the admin user yet (homes live on ZFS
# and arrive later via `zfs recv`), so root Ansible's temp dir in /tmp — otherwise
# every task fails to mkdir ~/.ansible/tmp before the pool exists.
remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become = True
become_method = sudo
