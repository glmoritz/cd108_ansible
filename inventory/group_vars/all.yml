# ===========================================================================
# Values below are grounded in a harvest of the cd108 golden (cd108-test-01,
# Ubuntu 24.04.4). Where the golden used a bespoke, untested mechanism we use
# the idiomatic Ansible path instead (hostname, home reset, WoL).
# ===========================================================================

# ---------------------------------------------------------------------------
# The infra hub (professor's PC). Referenced everywhere as server_host.
# ---------------------------------------------------------------------------
server_host: cd108.tutu.eng.br        # lab hub today → becomes the server VM's IP later
admin_user: daelt
ansible_user: "{{ admin_user }}"      # push connects over SSH as the admin account

# Control-node deploy key: a passphrase-less ed25519 key on this control node,
# used ONLY to manage the fleet (so unattended/overnight runs can authenticate
# without a human unlocking a passphrase). The common role installs the
# matching public key on every admin account; provisioning bakes it into the
# server/golden. Keep the private half on the control node only.
ansible_ssh_private_key_file: "~/.ssh/id_cd108_ansible"
professor_ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPt7TL+tEfuCQ6up+436oQ2+XJ8WeRNHbZFoSgUCtxKj cd108-ansible-control-node"

# apt cache: apt-cacher-ng runs on the SERVER (confirmed on the golden, which
# points here). apt-cacher-ng only proxies http, so https is disabled and we
# force IPv4 — the common role writes exactly this into /etc/apt/apt.conf.d.
# (103.0.1.16 was only the transitional daily-driver; the server is canonical.)
apt_proxy_url: "http://{{ server_host }}:3142"

# --- NFS: the public "troca" exchange folder (sticky-bit protected) -------
nfs_exchange_dir: /srv/troca
# The lab subnet (IPv4 /19, confirmed on the server's eno1). ZFS `sharenfs`
# datasets additionally scope to the IPv6 prefix 2801:82:c004:103::/64.
nfs_export_clients: "103.0.0.0/19"
# ZFS `sharenfs` ACL for datasets distributed over NFS (golden, clipboard).
# IPv4 subnet only: it's an ACL by SUBNET (not per-host), so dynamic IPs are
# fine, and every lab machine has an address in 103.0.0.0/19. IPv6 is dropped
# here on purpose — zfs sharenfs → exportfs mangles bracketed IPv6 prefixes
# ("Failed to resolve ..."); NFS rides IPv4 while SSH/Ansible use IPv6/EUI-64.
nfs_share_acl: "rw=@103.0.0.0/19"

# --- MATLAB: LOCAL install, campus NETWORK license (FlexLM) ---------------
# The binary is image-owned at matlab_root; Ansible only writes the network
# license pointer. Students run it as the `estudante` account.
matlab_root: /usr/local/MATLAB/R2024b
matlab_license_server: |
  SERVER licencas.ct.utfpr.edu.br 0AAA81D7B626 27000
  USE_SERVER

# --- ZFS: pool built by Ansible on the free space after the ext4 Ubuntu ---
# Golden reality: pool name is `ssdpool` on sda4 (fs LABEL ssdpool). Homes are
# one dataset per course account under ssdpool/home, each with a SEPARATE
# `Downloads` child dataset so bulky downloads survive a home reset. The
# emergency Windows VM is ssdpool/windows.
zfs_pool: ssdpool                       # local pool name on each student machine
zfs_data_device: /dev/disk/by-partlabel/zfs   # Clonezilla leaves this unformatted+labelled
zfs_pool_server: ssdpool                # pool name ON the server holding the goldens
server_zfs_device: /dev/vdb             # blank data disk on the server VM → the pool
golden_snapshot: golden                 # snapshot name of the golden datasets
# Overnight image sends run N machines AT A TIME and move to the next as each
# finishes (Ansible task-level `throttle`) — NOT a bandwidth cap. To have more
# than N truly in flight, also raise `forks` in ansible.cfg to >= this.
zfs_send_concurrency: 4

# ZFS snapshots are managed by SANOID (installed with the pool). The golden had
# sanoid installed with an EMPTY config (so nothing was actually snapshotting) —
# the zfs role now templates a real retention policy for the home datasets.
sanoid_datasets:
  - "{{ zfs_pool }}/home"
# frequent_period=15 + the packaged sanoid.timer (every 15 min) gives 15-minute
# snapshots; `frequently` is how many of those to keep (4 = last hour).
sanoid_retention:
  frequently: 4
  frequent_period: 15
  hourly: 24
  daily: 14
  weekly: 4
  monthly: 3

# One account per COURSE (not per student). Homes are the received ZFS datasets;
# these are the accounts whose homes get reset by reset-homes.yml. `daelt` is
# the admin account (admin_user) and is NOT reset.
discipline_users:
  - microcontroladores
  - redes
  - estudante

# Docker without sudo: on the golden ALL course accounts + daelt are in `docker`.
docker_users:
  - daelt
  - redes
  - microcontroladores
  - estudante

# --- SDR: build once on the server, distribute the artifact ---------------
sdr_dist_dir: /srv/nfs/sdr
sdr_packages:
  - build-essential
  - cmake
  - git
  - wget
  - libfftw3-dev
  - libairspy-dev
  - libairspyhf-dev
  - libhackrf-dev
  - librtlsdr-dev
  - libsoapysdr-dev
  - libuhd-dev
  - qtbase5-dev
  - qtchooser
  - qt5-qmake
  - libglfw3-dev
  - libglfw3
  - qttools5-dev-tools
  - libzstd-dev
  - librtaudio-dev
  - libpulse-dev
  - libiio-dev
  - libad9361-dev
  - portaudio19-dev
  - libqt5widgets5t64        # golden ships the t64 (time_t 64-bit) variant on 24.04
  - uhd-host
  - rtl-sdr

# --- Desktop: XFCE + xrdp (RDP), not GNOME/VNC ----------------------------
captive_portal_url: "https://captiveportal.utfpr.edu.br"   # confirm real URL
desktop_packages:
  - xfce4
  - xfce4-goodies
  - xrdp                     # remote desktop is RDP, not VNC
  - gnome-remote-desktop
  - freerdp2-x11
  - google-chrome-stable     # extra browser alongside the Firefox snap

# The professor's shared "clipboard": a persistent ssdpool/clipboard dataset,
# writable only by members of this group, surfaced through xrdp's sesman.ini.
# (Bespoke — no native Ansible equivalent; see roles/desktop.)
clipboard_group: clipboardwriters
clipboard_writers:
  - daelt
  - microcontroladores

# --- WoL: NIC supports it; enable magic-packet wake via a udev rule -------
# NIC names vary per machine (eno1 / enp3s0 / eth0 …), so default to each
# host's fact-discovered default-route interface. Override per host if needed.
wol_interface: "{{ ansible_default_ipv4.interface | default('') }}"

# --- Packages that are plain apt installs ---------------------------------
common_packages:
  - build-essential
  - cmake
  - git
  - curl
  - wget
  - vim
  - net-tools
  - nmap
  - wireshark
  - tcpdump
  - plocate
  - gparted
  - gdebi
  - ethtool
  - meld
  - qdirstat
  - gimp
  - inkscape
  - pinta
  - xournalpp
  - mosquitto-clients
  - moserial
  - openocd
  - openssh-server
  - nfs-common
  - avahi-daemon            # mDNS: advertises <hostname>.local so we address
  - libnss-mdns             #   hosts by name, not by (unfixed) IP
  - netcat-openbsd          # `nc` — start-windows-vm.sh polls RDP with it
  - python3-pip
  - python3-venv

# --- Heavy/local apps -----------------------------------------------------
# TeX is a full local apt install. The ST/SEGGER embedded stack (STM32CubeIDE,
# CubeMX, ST-Link server, SEGGER J-Link) is NOT apt-installable — ST/SEGGER
# ship installers/.debs, not apt repos. It's image-owned instead: the binaries
# arrive in the received golden home (roles/zfs, same path as CubeMX), and the
# device udev rules are baked into the Clonezilla-imaged /etc. So only the
# genuinely packaged tools live here.
tex_packages:
  - texlive-full
embedded_packages:
  - stlink-tools             # open-source st-flash/st-util (real Ubuntu package)
  - qucs-s                   # from the ra3xdh OBS repo (see external repos)
# NOTE: STM32CubeIDE/CubeMX + ST-Link server + SEGGER J-Link are delivered in
# the received golden home, NOT installed by Ansible.

# --- Virtualization: the Windows emergency VM + wine for lighter Win apps -
virt_packages:
  - qemu-system-x86
  - libvirt-daemon-system
  - libvirt-clients
  - virt-manager
  - virt-install
  - python3-libvirt          # community.libvirt.* modules need these on the target
  - python3-lxml
  - ovmf                     # secure-boot UEFI firmware the win11 domain requires
  - swtpm                    # emulated TPM 2.0 (the domain has a <tpm> device)
  - swtpm-tools
  - wine64
  - winetricks

# --- Windows emergency VM (libvirt/KVM; disk = qcow2 on ssdpool/windows) ---
# The DOMAIN + qcow2 are image-owned (qcow2 received via the zfs role). Ansible
# owns the *config layer*: the revert wiring + scoped passwordless sudo + the
# launcher. On each launch the disk is rolled back to a clean teaching baseline.
# NOTE: the golden's sudoers allowed @clean but the script reverted to @ltspice
# (a no-password-match bug) — this single var now drives BOTH, consistently.
winvm_domain: win11
winvm_dataset: "{{ zfs_pool }}/windows"
winvm_disk_path: "/mnt/{{ winvm_dataset }}/windows.qcow2"   # qcow2 in the dataset
winvm_revert_snapshot: ltspice          # clean baseline: bare Windows + LTspice
winvm_ip: 192.168.122.67                # VM's IP (DHCP reservation on the NAT net)
# UUID/MAC are kept identical fleet-wide ON PURPOSE: each host's libvirt + NAT is
# isolated (no collision), the DHCP reservation is keyed on the MAC, and a stable
# UUID keeps the guest's Windows activation happy.
winvm_uuid: "056f95c3-af04-46a7-9d97-140fdd1612c3"
winvm_mac: "52:54:00:ba:e3:f0"
winvm_memory_mib: 4096
winvm_vcpus: 4
winvm_rdp_user: daelt
# SECURITY: the golden shipped this password in a world-readable script. Put the
# REAL value in a VAULTED var (ansible-vault), never in plaintext here.
winvm_rdp_password: "CHANGEME-vault-this"
