# Addressing lab machines WITHOUT fixed IPs.
#
# The MAC (recorded per host in hosts.yml) is the stable identity. With IPv6
# privacy extensions disabled (common role sets use_tempaddr=0), a host's
# lower 64 bits are a deterministic EUI-64 derived from that MAC — so its
# address is computable with no DHCP, DNS, mDNS, or registry server. This is
# what breaks the "name it before you can reach it" bootstrap: a freshly
# imaged clone (still carrying the golden's name) is reachable immediately by
# its MAC-derived address.
#
#   * Set lab_ipv6_prefix to the router-advertised /64 and hosts are reached
#     by their routable GLOBAL address (prefix + EUI-64) — works across
#     subnets, matching the control node's own prefix.
#   * Leave it empty to fall back to LINK-LOCAL (same L2 segment only), using
#     the control node's uplink interface as the IPv6 zone id.
#
# Addressing precedence (highest first):
#   1. a per-host ansible_host in hosts.yml / a `-i overlay.yml` pin (a host var
#      always beats this group var) — the manual override;
#   2. the address the machine last PHONED HOME from (beacon_ip, matched by MAC)
#      — a known-reachable IP, so it covers machines that never get EUI-64 IPv6;
#   3. the EUI-64 IPv6 derived from the MAC (below) — the zero-infra default,
#      used until a machine has phoned home at least once.
# There is no per-connection fallback in Ansible: it dials whatever ansible_host
# resolves to, so the beacon must be *preferred* (not a runtime retry) for a
# v6-less box to be reachable. The beacon log lives on the control node (the
# server); reading it off-server just yields '' (errors='ignore') → EUI-64.
                                        # NOTE: single TRAILING COLON, not "::".
                                        # It is string-concatenated with the full
                                        # 64-bit EUI-64 ifid (`{{prefix}}{{ifid}}`),
                                        # so the CIDR "::" form yields 8 groups + a
                                        # stray "::" = an INVALID address that no
                                        # resolver accepts (fixed 2026-07-14).
lab_ipv6_prefix: "2801:82:c004:103:"    # router-advertised /64 is 2801:82:c004:103::/64;
                                        # with privacy ext off (common role) a host's
                                        # global addr = this + its EUI-64.
# This is the CONTROL NODE's own NIC (one value, not per lab machine); it is
# only used as the IPv6 zone id in the link-local fallback (empty prefix).
lab_uplink_iface: eno1

# The phone-home beacon log on the control node (the server). See beacon_ip.
beacon_log: /var/log/phone-home/beacons.jsonl

# The address the machine last phoned home from (matched by MAC), or '' if it
# never has / the log isn't here. errors='ignore' keeps this empty (→ EUI-64)
# when converging from a box that isn't the hub.
lab_beacon_ip: "{{ lookup('file', beacon_log, errors='ignore') | default('', true) | beacon_ip(mac) }}"

# The zero-infra EUI-64 default (global if a prefix is set, else link-local).
lab_eui64_host: >-
  {{ (lab_ipv6_prefix ~ (mac | eui64_ifid))
     if (lab_ipv6_prefix | length > 0)
     else (mac | eui64_linklocal) ~ '%' ~ lab_uplink_iface }}

# Prefer the known-reachable phone-home address; fall back to EUI-64.
ansible_host: "{{ lab_beacon_ip if (lab_beacon_ip | length > 0) else lab_eui64_host }}"
