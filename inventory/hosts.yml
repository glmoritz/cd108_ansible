# Static group HIERARCHY only. The individual lab machines are supplied by the
# dynamic inventory (lab_hosts.py), which reads the fleet registry hosts.txt
# from the hub. Ansible merges this file with the script, so the lab groups
# defined empty here get their hosts filled in at runtime.
#
# Hostname-per-MAC is thus declarative end-to-end: name a machine in the
# registry and it appears in the right lab group here — no boot-time rename.
all:
  children:
    server:                       # the lab hub (holds golden datasets, NFS exchange)
      hosts:
        cd108.tutu.eng.br: {}     # → will become the server VM's IP in production

    labs:                         # the ~50 student machines, grouped by lab
      children:
        cd108: {}                 # hosts injected by lab_hosts.py from the registry
        cd106: {}
        cb203: {}
        ca307: {}

    # Only ca307 joins FreeIPA (see site.yml). A group can join partially later.
    freeipa_members:
      children:
        ca307: {}

# Note: the apt-cacher-ng host is the server ({{ server_host }}:3142), per the
# golden's own config — see apt_proxy_url in group_vars/all.yml.
