# Real hostnames/IPs go here once you have SSH access.
# Hostname-per-MAC is set declaratively: name the host here and `common`
# applies it — no boot-time rename script needed.
all:
  children:
    server:                       # the lab hub (holds golden datasets, NFS exchange)
      hosts:
        cd108.tutu.eng.br: {}     # → will become the server VM's IP in production

    labs:                         # the ~50 student machines, grouped by lab
      children:
        cd108:
          hosts: {}               # pc-cd108-01: { ansible_host: ..., mac: "aa:bb:.." }
        cd106:
          hosts: {}
        cb203:
          hosts: {}
        ca307:
          hosts: {}

    # Only ca307 joins FreeIPA (see site.yml). A group can join partially later.
    freeipa_members:
      children:
        ca307: {}

# Note: the apt-cacher-ng host is currently the professor's daily driver
# (103.0.1.16), NOT this server — see apt_proxy_url in group_vars/all.yml.
