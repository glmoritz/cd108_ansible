# Static inventory — the single source of truth for the fleet, in git.
#
# Add a machine by listing it under its lab below. Each lab host needs only its
# `mac`; group_vars/labs.yml derives `ansible_host` as the EUI-64 IPv6 from it
# (2801:82:c004:103:: + MAC). A per-host `ansible_host` (e.g. a pinned IPv4)
# overrides that. That's the whole registry — no external hosts.txt, no
# boot-time self-naming: declare a host here and it's managed.
#
# ---------------------------------------------------------------------------
# SEEDED 2026-07-10 from the professor PC's http://103.0.1.12/hostlist.txt
# (MAC -> hostname map). Names standardized to <room>-NN (was DAELT-CD-106-01,
# daelt-cd108-04, ...). PROVISIONAL — final naming/numbering ("padronize") is
# still TBD. MACs are the stable truth; names may be renumbered later.
#
# Relocations: machines physically moved cd106 -> cd108. Renumbered into the
# cd108 group 2026-08-19 (old cd106-0N names retired to avoid confusion):
#   cd106-02->cd108-24, -03->cd108-25, -04->cd108-26, -05->cd108-27, -07->cd108-28.
#   cd106-01 stays as cd108-test-01 (the golden/reference box).
# Gaps: cd108-10 unused; all of ca307 not in the source list yet.
# ---------------------------------------------------------------------------
all:
  children:
    server:                       # the lab hub (holds golden datasets, NFS exchange)
      hosts:
        cd108.tutu.eng.br:
          # static campus IP on the bridge (ens7); DNS (cd108.tutu.eng.br) points
          # here. The VM keeps a NAT NIC (ens2) for its own internet past the
          # captive portal. On the ephemeral br0 — re-run scripts/labnet-bridge.sh
          # up after a host reboot (the VM NIC is persistent, br0 is not yet).
          ansible_host: 103.0.1.43

    labs:                         # the student machines, grouped by lab (room)
      children:
        cd108:                    # room CD108
          hosts:
            # --- ex-golden/reference box (physically cd106-01, relocated); as of
            # 2026-08-28 repurposed as the PROFESSOR'S DESK MACHINE — converges
            # fully like any lab host now (desktop/zfs/winvm/sdr/matlab), no
            # longer treated as a --tags common-only reference/authoring box.
            # Golden authoring moves to a fresh flashtest VM on moritz-desktop.
            # ansible_host pin removed 2026-08-28: it now boots normal Ubuntu on
            # the professor's desk (not the old live-USB session), so it's
            # reachable the same way as every other lab host (beacon/EUI-64).
            cd108-test-01:                 # golden/reference box; MAC = cd106-01
              mac: "e0:d5:5e:f6:08:18"
