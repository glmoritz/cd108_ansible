# Static inventory — the single source of truth for the fleet, in git.
#
# Add a machine by listing it under its lab below. `ansible_host` is the
# address the control node connects to (an IP, or a resolvable name). `mac`
# is recorded for Wake-on-LAN. That's the whole registry — no external
# hosts.txt, no boot-time self-naming: declare a host here and it's managed.
all:
  children:
    server:                       # the lab hub (holds golden datasets, NFS exchange)
      hosts:
        cd108.tutu.eng.br:
          # the server VM runs on NAT for now (reachable from this control
          # node); becomes the real lab-LAN address once the VM is bridged.
          ansible_host: 192.168.122.150

    labs:                         # the student machines, grouped by lab
      children:
        cd108:
          hosts:
            cd108-test-01:                 # the golden/reference box
              ansible_host: 103.0.2.13     # not in campus DNS yet → pin the IP
              mac: "e0:d5:5e:f6:08:18"
        cd106:
          hosts: {}
        cb203:
          hosts: {}
        ca307:
          hosts: {}

    # Only ca307 joins FreeIPA (see site.yml). A group can join partially later.
    freeipa_members:
      children:
        ca307: {}

# Note: the apt-cacher-ng host is the server ({{ server_host }}:3142), per the
# golden's own config — see apt_proxy_url in group_vars/all.yml.
