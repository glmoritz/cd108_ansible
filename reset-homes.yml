---
# DELIBERATE, DESTRUCTIVE home reset. NOT part of site.yml. Run by hand ~2-3x
# per semester, after students have uploaded to the cloud:
#
#   ansible-playbook reset-homes.yml --limit lab_a        # one lab at a time
#
# Pushes a freshly-built golden home from the server onto each machine via the
# prof->student SSH keys you already have. Receiving a clean golden (not a local
# rollback) is what keeps vscode configs consistent.
#
# OPTIMISATION (since this runs several times a semester, not just at break):
# if the student keeps the previously received golden snapshot, switch the send
# to INCREMENTAL (`zfs send -i golden_prev golden_new`) so only the delta crosses
# the wire — much faster than a full send each time. Full send is used below for
# the first/clean case.
- name: Reset course homes to the server golden
  hosts: labs
  # Roll in waves of N machines at a time (destructive → limit blast radius);
  # each wave finishes before the next starts. Default 4 matches
  # zfs_send_concurrency; override with -e reset_serial=N.
  serial: "{{ reset_serial | default(4) }}"
  gather_facts: false
  tasks:
    - name: Snapshot then send each course golden home onto this machine
      shell: >-
        zfs send {{ zfs_pool_server }}/golden/home/{{ item }}@{{ golden_snapshot }}
        | mbuffer -q
        | ssh -i {{ deploy_key_on_server }} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ admin_user }}@{{ ansible_host | default(inventory_hostname) }} "zfs recv -F {{ zfs_pool }}/home/{{ item }}"
      delegate_to: "{{ server_host }}"
      loop: "{{ discipline_users }}"
